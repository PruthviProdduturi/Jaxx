<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Jaxx - give an agent a mandate it can't overstep">
  <rect width="1200" height="630" fill="#0d1117"/>

  <text x="96" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="4" fill="#8b98a8">COPILOT PLUGIN &#183; MIT</text>

  <!-- The mark is the wordmark: the rail sits under the J and nowhere else. -->
  <text x="96" y="212" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-3" fill="#e6edf3">Jaxx</text>
  <rect x="95" y="228" width="49" height="7" rx="3.5" fill="#7fb0ff"/>

  <text x="96" y="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="-1" fill="#e6edf3">Give an agent a mandate it can&#8217;t overstep.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <g>
      <rect x="96" y="410" width="464" height="60" rx="11" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
      <rect x="96" y="410" width="4" height="60" rx="2" fill="#7ee2a8"/>
      <text x="126" y="447" fill="#c6d2e0">status question <tspan fill="#7ee2a8">&#8594; posts</tspan></text>
    </g>
    <g>
      <rect x="96" y="486" width="464" height="60" rx="11" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
      <rect x="96" y="486" width="4" height="60" rx="2" fill="#ffb86b"/>
      <text x="126" y="523" fill="#c6d2e0">&#8220;she said it&#8217;s fine&#8221; <tspan fill="#ffb86b">&#8594; refused</tspan></text>
    </g>
    <g>
      <rect x="640" y="410" width="464" height="60" rx="11" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
      <rect x="640" y="410" width="4" height="60" rx="2" fill="#4a5563"/>
      <text x="670" y="447" fill="#c6d2e0">notes-only room <tspan fill="#8b98a8">&#8594; silent</tspan></text>
    </g>
    <g>
      <rect x="640" y="486" width="464" height="60" rx="11" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
      <rect x="640" y="486" width="4" height="60" rx="2" fill="#7fb0ff"/>
      <text x="670" y="523" fill="#c6d2e0">context compacted <tspan fill="#7fb0ff">&#8594; remembers</tspan></text>
    </g>
  </g>
</svg>
