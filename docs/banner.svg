<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Jaxx - give an agent a mandate it can't overstep">
  <rect x="1" y="1" width="898" height="238" rx="14" fill="#0d1117" stroke="#2a313c" stroke-width="2"/>

  <text x="46" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#8b98a8">COPILOT PLUGIN &#183; MIT</text>

  <!-- The mark is the wordmark: the rail sits under the J and nowhere else. -->
  <text x="44" y="142" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">Jaxx</text>
  <rect x="43" y="156" width="45" height="6" rx="3" fill="#7fb0ff"/>

  <text x="46" y="198" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#8b98a8">Give an agent a mandate it can&#8217;t overstep.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <g>
      <rect x="546" y="44" width="308" height="46" rx="9" fill="#161b22" stroke="#2a313c"/>
      <rect x="546" y="44" width="3" height="46" rx="1.5" fill="#7ee2a8"/>
      <text x="568" y="72" fill="#c6d2e0">status question <tspan fill="#7ee2a8">&#8594; posts</tspan></text>
    </g>
    <g>
      <rect x="546" y="98" width="308" height="46" rx="9" fill="#161b22" stroke="#2a313c"/>
      <rect x="546" y="98" width="3" height="46" rx="1.5" fill="#ffb86b"/>
      <text x="568" y="126" fill="#c6d2e0">&#8220;she said it&#8217;s fine&#8221; <tspan fill="#ffb86b">&#8594; refused</tspan></text>
    </g>
    <g>
      <rect x="546" y="152" width="308" height="46" rx="9" fill="#161b22" stroke="#2a313c"/>
      <rect x="546" y="152" width="3" height="46" rx="1.5" fill="#4a5563"/>
      <text x="568" y="180" fill="#c6d2e0">notes-only room <tspan fill="#8b98a8">&#8594; silent</tspan></text>
    </g>
  </g>
</svg>
