<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-label="Jaxx - give an agent a mandate it can't overstep">
  <title>Jaxx</title>
  <rect width="600" height="160" rx="16" fill="#0d1117"/>

  <!-- The mark is the wordmark: the rail sits under the J and nowhere else. -->
  <text x="40" y="80" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#e6edf3">Jaxx</text>
  <rect x="39" y="92" width="38" height="5" rx="2.5" fill="#7fb0ff"/>

  <text x="40" y="128" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b98a8">Give an agent a mandate it can&#8217;t overstep.</text>
</svg>
